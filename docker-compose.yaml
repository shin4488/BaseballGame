version: "3"
services:
    # nginxで、ビルドした野球ゲーム（application/dist）を配信する
    web-server:
        build: ./web
        ports:
            - 80:80
            - 443:443
        volumes:
            # nginx
            - ./web/nginx.conf:/etc/nginx/nginx.conf
            # アプリ
            - ./application/dist:/home/baseballApp/dist
        env_file:
            - ./application/.env
