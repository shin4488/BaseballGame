<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="判定と判定の間にバットがボールを通り過ぎる例">
<title>判定と判定の間にバットがボールを通り過ぎる例</title>
<defs><marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4b5563"/></marker></defs>
<rect x="0" y="0" width="900" height="480" rx="12" fill="#ffffff"/>
<text x="24" y="36" font-size="17" fill="#111827" text-anchor="start" font-weight="bold">判定と判定の間にバットがボールを通り過ぎる例</text>
<text x="24" y="60" font-size="13" fill="#4b5563" text-anchor="start" font-weight="normal">ボールの判定は30msごと、バットの描き替えは10msごと。例では、描き替えが判定の10ms後・20ms後・30ms後にある。</text>
<line x1="274" y1="140" x2="274" y2="350" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<g transform="translate(150 100) scale(2) rotate(-30)"><rect x="-20" y="0" width="20" height="120" fill="none" stroke="#9ca3af" stroke-width="2" vector-effect="non-scaling-stroke" stroke-dasharray="6 4" opacity="1"/></g>
<g transform="translate(150 100) scale(2) rotate(-60)"><rect x="-20" y="0" width="20" height="120" fill="none" stroke="#9ca3af" stroke-width="2" vector-effect="non-scaling-stroke" opacity="1"/></g>
<g transform="translate(150 100) scale(2) rotate(-31)"><rect x="-20" y="0" width="20" height="120" fill="none" stroke="#15803d" stroke-width="2.5" vector-effect="non-scaling-stroke" opacity="1"/></g>
<circle cx="150" cy="100" r="5" fill="#7c3aed"/>
<circle cx="274" cy="210" r="40" fill="#9ca3af" fill-opacity="0.06" stroke="#9ca3af" stroke-width="2" stroke-dasharray="3 3"/><circle cx="274" cy="210" r="2.5" fill="#9ca3af"/>
<circle cx="274" cy="270" r="40" fill="#9ca3af" fill-opacity="0.06" stroke="#9ca3af" stroke-width="2" stroke-dasharray="3 3"/><circle cx="274" cy="270" r="2.5" fill="#9ca3af"/>
<circle cx="274" cy="230" r="40" fill="#15803d" fill-opacity="0.18" stroke="#15803d" stroke-width="2"/><circle cx="274" cy="230" r="2.5" fill="#15803d"/>
<text x="222" y="352" font-size="13" fill="#4b5563" text-anchor="end" font-weight="normal">-30度</text>
<text x="366" y="242" font-size="13" fill="#4b5563" text-anchor="start" font-weight="normal">-60度</text>
<line x1="318" y1="210" x2="442" y2="135" stroke="#4b5563" stroke-width="1" stroke-dasharray="1 3"/>
<text x="450" y="140" font-size="14" fill="#4b5563" text-anchor="start" font-weight="bold">前回の判定（0ms）</text>
<text x="450" y="158" font-size="14" fill="#4b5563" text-anchor="start" font-weight="normal">-30度・ボールは55px下: 触れていない</text>
<line x1="318" y1="230" x2="442" y2="203" stroke="#15803d" stroke-width="1" stroke-dasharray="1 3"/>
<text x="450" y="208" font-size="14" fill="#15803d" text-anchor="start" font-weight="bold">10ms後: -30度から-40度へ描き替える</text>
<text x="450" y="226" font-size="14" fill="#15803d" text-anchor="start" font-weight="normal">-31度を通るとき、65px下のボールに触れる → 当たり</text>
<line x1="318" y1="270" x2="442" y2="271" stroke="#4b5563" stroke-width="1" stroke-dasharray="1 3"/>
<text x="450" y="276" font-size="14" fill="#4b5563" text-anchor="start" font-weight="bold">今回の判定（30ms後）</text>
<text x="450" y="294" font-size="14" fill="#4b5563" text-anchor="start" font-weight="normal">-60度・ボールは85px下: 触れていない</text>
<rect x="200" y="358" width="620" height="22" rx="4" fill="#2563eb" fill-opacity="0.12"/>
<text x="510" y="374" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="normal">前回の判定から今回の判定までの間も調べる</text>
<line x1="200" y1="420" x2="820" y2="420" stroke="#4b5563" stroke-width="1.5"/>
<text x="170" y="404" font-size="13" fill="#111827" text-anchor="end" font-weight="normal">バット</text>
<text x="170" y="425" font-size="13" fill="#4b5563" text-anchor="end" font-weight="normal">時刻</text>
<text x="170" y="450" font-size="13" fill="#4b5563" text-anchor="end" font-weight="normal">ボール</text>
<line x1="200" y1="414" x2="200" y2="426" stroke="#4b5563" stroke-width="1.5"/>
<text x="200" y="404" font-size="13" fill="#111827" text-anchor="middle" font-weight="normal">-30度</text>
<text x="200" y="442" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal">0ms</text>
<text x="200" y="460" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="normal">55px下</text>
<line x1="406.66666666666663" y1="414" x2="406.66666666666663" y2="426" stroke="#4b5563" stroke-width="1.5"/>
<text x="406.66666666666663" y="404" font-size="13" fill="#111827" text-anchor="middle" font-weight="normal">-40度</text>
<text x="406.66666666666663" y="442" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal">10ms</text>
<text x="406.66666666666663" y="460" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="normal">65px下</text>
<line x1="613.3333333333333" y1="414" x2="613.3333333333333" y2="426" stroke="#4b5563" stroke-width="1.5"/>
<text x="613.3333333333333" y="404" font-size="13" fill="#111827" text-anchor="middle" font-weight="normal">-50度</text>
<text x="613.3333333333333" y="442" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal">20ms</text>
<text x="613.3333333333333" y="460" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="normal">75px下</text>
<line x1="820" y1="414" x2="820" y2="426" stroke="#4b5563" stroke-width="1.5"/>
<text x="820" y="404" font-size="13" fill="#111827" text-anchor="middle" font-weight="normal">-60度</text>
<text x="820" y="442" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal">30ms</text>
<text x="820" y="460" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="normal">85px下</text>
</svg>
